<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sprig app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2AC66C"/>
      <stop offset="1" stop-color="#12915A"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FB365"/>
      <stop offset="1" stop-color="#0E8A54"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#053a25" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- speech bubble -->
  <g filter="url(#soft)">
    <rect x="116" y="112" width="280" height="232" rx="60" fill="#FFFFFF"/>
    <path d="M180 300 L150 406 L266 322 Z" fill="#FFFFFF"/>
  </g>

  <!-- leaf -->
  <g transform="rotate(14 256 214)">
    <path d="M256 150 C300 178 300 250 256 278 C212 250 212 178 256 150 Z" fill="url(#leaf)"/>
    <path d="M256 162 L256 268" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <path d="M256 196 L230 182 M256 196 L282 182 M256 224 L234 212 M256 224 L278 212" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
